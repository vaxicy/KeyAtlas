<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeyAtlas — Shortcut Search Engine</title>
    <meta name="description" content="Search keyboard shortcuts for 150+ apps across Windows, macOS, Linux. Fast, free, open data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* 在样式生效前定好主题，避免深色模式用户看到白色闪屏 */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var stored = localStorage.getItem('keyatlas-theme');
          var mode = (urlTheme === 'dark' || urlTheme === 'light') ? urlTheme
                    : (stored === 'dark' ? 'dark' : 'light');
          if (urlTheme === 'dark' || urlTheme === 'light') {
            localStorage.setItem('keyatlas-theme', mode);
          }
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- 3D keycap: side/shadow -->
  <rect x="24" y="38" width="80" height="64" rx="16" fill="#c7c9f5"/>
  <!-- keycap face -->
  <rect x="24" y="32" width="80" height="64" rx="16" fill="#ffffff"/>
  <!-- top highlight (bevel) -->
  <rect x="36" y="42" width="56" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <!-- magnifier legend, centered on the key -->
  <circle cx="64" cy="60" r="20" fill="none" stroke="#6366f1" stroke-width="7"/>
  <line x1="78" y1="74" x2="94" y2="90" stroke="#6366f1" stroke-width="9" stroke-linecap="round"/>
</svg>
